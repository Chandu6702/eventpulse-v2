# Full-stack composition mirroring the AWS topology in infra/terraform:
# nginx (frontend + reverse proxy) -> api -> postgres.
#
#   docker compose -f docker-compose.prod.yml up --build
#
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventpulse']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventpulse
      DB_USERNAME: eventpulse
      DB_PASSWORD: ${DB_PASSWORD:-eventpulse}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - '8081:80'
    depends_on:
      - api

volumes:
  postgres-data:
