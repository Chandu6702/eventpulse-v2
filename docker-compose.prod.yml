# Containerised backend + database, mirroring the AWS topology in
# infra/terraform (the SPA deploys to static hosting — Amplify/S3 — and in
# dev runs via `npm run dev`, which proxies /api to :8080).
#
#   JWT_SECRET=some-32-char-secret docker compose -f docker-compose.prod.yml up --build
#
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventpulse']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventpulse
      DB_USERNAME: eventpulse
      DB_PASSWORD: ${DB_PASSWORD:-eventpulse}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
