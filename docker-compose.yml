# Optional: dev database via Docker — `docker compose up -d`.
# Credentials match the backend's dev defaults.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: eventpulse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventpulse']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
