spring:
  application:
    name: eventpulse-api

  # Real local credentials live in a git-ignored backend/application-local.yml
  # (see README). In hosted environments (e.g. Render) environment variables
  # override everything here — no local file needed there.
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USERNAME:eventpulse}
    password: ${DB_PASSWORD:eventpulse}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    jwt:
      # HS256 signing key. Override in any real environment.
      secret: ${JWT_SECRET:dev-only-signing-secret-change-me-0123456789abcdef}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    # How long a pending order holds inventory before it is released.
    hold-duration: ${BOOKING_HOLD_DURATION:10m}
  ai:
    # Optional analytics insights. With no api-key the insight endpoints
    # return 204 and the dashboard shows numbers only.
    # provider: anthropic (paid) or gemini (free tier at aistudio.google.com)
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${AI_API_KEY:}
    # Blank = the provider's default model.
    model: ${AI_MODEL:}
