spring:
  application:
    name: eventpulse-api

  # Local secrets (real DB credentials etc.) live in a git-ignored file so
  # they can never be committed. Create backend/local-secrets.properties
  # with e.g. DB_URL=..., DB_USERNAME=..., DB_PASSWORD=...
  config:
    import: optional:file:./local-secrets.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USERNAME:eventpulse}
    password: ${DB_PASSWORD:eventpulse}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    jwt:
      # HS256 signing key. Override in any real environment.
      secret: ${JWT_SECRET:dev-only-signing-secret-change-me-0123456789abcdef}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    # How long a pending order holds inventory before it is released.
    hold-duration: ${BOOKING_HOLD_DURATION:10m}
